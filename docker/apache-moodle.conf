<VirtualHost *:80>
    DocumentRoot /var/www/moodle/public

    # Vitrines des formateurs Oriskill : oriskill.com/nom, seulement si aucun fichier ni dossier Moodle
    # ne porte ce nom (les noms de Moodle sont aussi refusés à la création d'un espace formateur).
    RewriteEngine On
    RewriteRule ^/f/([a-z0-9-]+)/?$ /$1 [R=301,L]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.php !-f
    RewriteRule ^/([a-z0-9]+(-[a-z0-9]+)*)/?$ /local/oriskill/creator.php?slug=$1 [PT,QSA,L]

    # Page commerciale de l'éditeur de Modern Commerce (vente du plugin lui-même) : renvoyée vers le catalogue.
    RewriteRule ^/local/moderncommerce/pricing\.php$ /local/moderncommerce/index.php [R=301,L]

    <Directory /var/www/moodle/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Routeur Moodle (URLs sans r.php)
        FallbackResource /r.php
    </Directory>

    # Fichiers de développement à ne pas exposer
    <FilesMatch "^(\..*|composer\.(json|lock)|package(-lock)?\.json|.*\.dist)$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
