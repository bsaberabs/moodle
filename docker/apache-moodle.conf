<VirtualHost *:80>
    DocumentRoot /var/www/moodle/public

    # Vitrines des formateurs Oriskill : /f/nom
    RewriteEngine On
    RewriteRule ^/f/([a-z0-9-]+)/?$ /local/oriskill/creator.php?slug=$1 [PT,QSA,L]

    <Directory /var/www/moodle/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Routeur Moodle (URLs sans r.php)
        FallbackResource /r.php
    </Directory>

    # Fichiers de développement à ne pas exposer
    <FilesMatch "^(\..*|composer\.(json|lock)|package(-lock)?\.json|.*\.dist)$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
