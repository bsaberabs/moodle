; Réglages recommandés pour Moodle
memory_limit = 512M
max_input_vars = 5000
; Vidéos de formation : 900 Mo par fichier (Caddy, devant le site, accepte jusqu'à 1 Go par requête).
upload_max_filesize = 900M
post_max_size = 950M
max_execution_time = 300
; Temps laissé pour recevoir un gros fichier sur une connexion lente : une heure, comme Caddy devant le site
; (read_timeout et write_timeout). Le plus court des deux coupe l'envoi.
max_input_time = 3600

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.use_cwd = 1
opcache.validate_timestamps = 1
opcache.save_comments = 1
opcache.enable_file_override = 0
