name: Feature request
description: Propose an improvement to ModernCommerce
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the user or business problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribution
    attributes:
      label: Are you willing to contribute an implementation?
      options:
        - "Yes"
        - "No"
        - "Maybe, with guidance"
    validations:
      required: true
